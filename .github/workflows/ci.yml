name: Validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:unit
      - run: npm run lint
      - run: python3 tests/migrations.py
      - run: npm run typecheck
      - run: npm run build
